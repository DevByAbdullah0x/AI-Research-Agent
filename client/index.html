<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Research Agent - Evidence-First Web Research</title>
    <!-- Google Fonts: Plus Jakarta Sans & Instrument Serif -->
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Tailwind CSS CDN with Forms & Container Plugins -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <!-- Tailwind Configuration -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                50: '#FFF9F3',
                100: '#FFF0E3',
                200: '#FFE2CA',
                300: '#FDBA74',
                400: '#FB923C',
                500: '#FF6B2B',
                600: '#EA580C',
                700: '#C2410C',
                dark: '#1E1B18'
              },
              surface: {
                cream: '#FAF7F2',
                card: '#FFFFFF',
                sidebar: '#FFFFFF',
                border: '#EDE5DB',
                borderLight: '#F3ECE3'
              }
            },
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
              serif: ['"Instrument Serif"', 'Georgia', 'serif']
            },
            boxShadow: {
              'warm-sm': '0 1px 3px rgba(234, 88, 12, 0.05), 0 1px 2px rgba(0, 0, 0, 0.02)',
              'warm-md': '0 4px 14px -2px rgba(234, 88, 12, 0.08), 0 2px 6px -1px rgba(0, 0, 0, 0.04)',
              'warm-lg': '0 10px 30px -4px rgba(255, 107, 43, 0.12), 0 4px 12px -2px rgba(0, 0, 0, 0.04)',
              'glow': '0 0 25px -4px rgba(255, 107, 43, 0.35)'
            }
          }
        }
      };
    </script>
    <!-- Custom Styles for Typography & UI Polish -->
    <style data-purpose="custom-typography">
      .font-display-serif {
        font-family: 'Instrument Serif', Georgia, serif;
      }
      .text-balance {
        text-wrap: balance;
      }
    </style>
    <style data-purpose="layout-and-scroll">
      /* Subtle custom scrollbar */
      ::-webkit-scrollbar {
        width: 5px;
        height: 5px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #E5DDD3;
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #D4C9BC;
      }
    </style>
  </head>
  <body class="bg-surface-cream text-stone-800 font-sans antialiased min-h-screen flex selection:bg-brand-100 selection:text-brand-700">
    <div id="root" class="w-full flex min-h-screen"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
